name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python tests/test_queue.py
